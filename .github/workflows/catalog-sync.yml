name: Validate and sync public catalog
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 6:00 PM Eastern Standard Time (7:00 PM during daylight
    # saving time), after the weekly catalog audit has closed passed deadlines.
    - cron: '0 23 * * 1'
permissions:
  contents: read
jobs:
  validate-and-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate public-only catalog
        run: npm test
      - name: Audit freshness
        run: npm run audit
      # The Supabase mirror step was removed on 2026-11-23 (user-approved): the
      # site never reads it and its failing sync sent weekly failure emails.
      # scripts/sync_catalog.mjs remains for manual use.
