name: Validate and sync public catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: read
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public-only catalog
        run: npm test
      - name: Audit freshness
        run: npm run audit
      - name: Sync public catalog mirror
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync_catalog.mjs
