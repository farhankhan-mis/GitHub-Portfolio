name: Validate and sync public catalog
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 AM Eastern during daylight saving time.
    - cron: '0 14 * * 1'
permissions:
  contents: read
jobs:
  validate-and-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate public-only catalog
        run: npm test
      - name: Audit freshness
        run: npm run audit
      - name: Sync public catalog mirror
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync_catalog.mjs
